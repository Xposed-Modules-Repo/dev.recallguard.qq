import java.util.Properties

plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing-private/signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'dev.recallguard.qq'
    compileSdk {
        version = release(37) {
            minorApiLevel = 0
        }
    }
    ndkVersion '29.0.13599879'

    defaultConfig {
        applicationId 'dev.recallguard.qq'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '1.3.0-qq-9.2.60-modern-performance'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                cppFlags '-std=c++20', '-fvisibility=hidden', '-fno-exceptions', '-fno-rtti'
            }
        }
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig signingPropertiesFile.isFile() ? signingConfigs.getByName('release') : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.0'
        }
    }

    packagingOptions {
        jniLibs {
            // LSPosed's module class loader resolves native libraries through
            // base.apk!/lib/<abi>; the entry must therefore be uncompressed.
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
